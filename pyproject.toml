[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "huddle-cluster"
version = "1.3.3"
description = "A penguin-inspired self-organizing server load balancer with adaptive thermal eviction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rahad Bhuiya", email = "rahadbhuiya2021@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "load-balancer", "load-balancing", "distributed-systems",
    "server-routing", "bio-inspired", "penguin", "self-organizing",
    "adaptive", "anomaly-detection", "fairness"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0"
]
benchmark = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27.0"
]
dev = [
    "pytest>=8.2.0",
    "pytest-timeout>=2.3.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/rahadbhuiya/HuddleCluster"
Repository = "https://github.com/rahadbhuiya/HuddleCluster"
Documentation = "https://github.com/rahadbhuiya/HuddleCluster#readme"
"Bug Tracker" = "https://github.com/rahadbhuiya/HuddleCluster/issues"
Paper = "https://github.com/rahadbhuiya/HuddleCluster/blob/main/docs/HuddleCluster_arxiv.pdf"

[tool.setuptools.packages.find]
where = ["."]
include = ["huddle_cluster*"]

[tool.setuptools.package-data]
huddle_cluster = ["py.typed"]
