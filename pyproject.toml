[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "huddle-cluster"
version = "1.2.0"
description = "A penguin-inspired self-organizing server load balancer with adaptive thermal eviction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rahad Bhuiya" }]
requires-python = ">=3.10"
dependencies = []   # core library has zero runtime dependencies

[project.optional-dependencies]
fastapi = ["fastapi>=0.111.0", "uvicorn[standard]>=0.29.0", "httpx>=0.27.0", "pydantic>=2.7.0"]
benchmark = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.13", "httpx>=0.27.0"]
dev = ["pytest>=8.2.0", "pytest-timeout>=2.3.0"]

[project.urls]
Homepage = "https://github.com/rahadbhuiya/HuddleCluster"
Repository = "https://github.com/rahadbhuiya/HuddleCluster"

[tool.setuptools.packages.find]
where = ["."]
include = ["huddle_cluster*"]
