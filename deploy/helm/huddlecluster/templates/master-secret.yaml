{{- if and .Values.master.auth.apiKeys (not .Values.master.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huddlecluster.authSecretName" . }}
  labels:
    {{- include "huddlecluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed by the wrapper entrypoint in master.yaml, which builds
  # --api-key KEY=ROLE arguments from this at container start — kept
  # out of the Pod spec's args/command directly so keys don't show up
  # in `kubectl describe pod` / `kubectl get pod -o yaml`.
  api-keys.json: |
    {{- toJson .Values.master.auth.apiKeys | nindent 4 }}
{{- end }}